[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "headroom-ai"
version = "0.1.0"
description = "Headroom - Context Optimization Layer. Reduce LLM API costs by 50-90% through intelligent context compression."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Priyansh", email = "priyansh@example.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pydantic>=2.0.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
langchain = ["langchain>=0.1.0"]
agno = ["agno>=0.1.0"]
code = ["tree-sitter>=0.20.0", "tree-sitter-python>=0.20.0"]
llmlingua = ["llmlingua-2>=0.1.0"]
proxy = ["fastapi>=0.100.0", "uvicorn>=0.23.0", "httpx>=0.24.0"]
all = ["langchain>=0.1.0", "agno>=0.1.0", "tree-sitter>=0.20.0", "tree-sitter-python>=0.20.0", "llmlingua-2>=0.1.0", "fastapi>=0.100.0", "uvicorn>=0.23.0", "httpx>=0.24.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
