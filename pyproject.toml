[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "headroom-ai"
version = "0.1.0"
description = "Headroom - Context Optimization Layer"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
langchain = ["langchain>=0.1.0"]
agno = ["agno>=0.1.0"]
code = ["tree-sitter>=0.20.0"]
llmlingua = ["llmlingua-2>=0.1.0"]
proxy = ["fastapi>=0.100.0", "uvicorn>=0.23.0"]
all = ["langchain>=0.1.0", "agno>=0.1.0", "tree-sitter>=0.20.0", "llmlingua-2>=0.1.0", "fastapi>=0.100.0", "uvicorn>=0.23.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
